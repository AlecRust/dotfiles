[privacy]
telemetry_enabled = false
crash_reporting_enabled = false
custom_secret_regex_list = []

[appearance.text]
font_size = 15.0
font_name = "FiraCode Nerd Font Mono"

[appearance.window]
override_blur = 40
override_opacity = 80

[appearance.themes]
system_theme = true
selected_system_themes = { dark = "cyber_wave", light = "light" }

[appearance.cursor]
cursor_blink = "disabled"

[appearance.panes]
should_dim_inactive_panes = true

[code.editor]
use_warp_as_default_editor = true

[code.indexing]
agent_mode_codebase_context_auto_indexing = true

[general]
restore_session = false
login_item = false

[terminal.input]
error_underlining_enabled = false
show_hint_text = false
honor_ps1 = true

[notifications.preferences]
mode = "enabled"

[agents]
cloud_conversation_storage_enabled = false

[agents.warp_agent.active_ai]
code_suggestions_enabled = false

[agents.warp_agent.input]
ai_auto_detection_enabled = false
nld_in_terminal_enabled = false

[agents.warp_agent.other]
should_render_use_agent_toolbar_for_user_commands = false

[agents.execution_profiles]

[agents.execution_profiles.default]
apply_code_diffs = "agent_decides"
ask_user_question = "always_ask"
autosync_plans_to_warp_drive = true
command_allowlist = []
command_denylist = [
  'bash(\s.*)?',
  'fish(\s.*)?',
  'pwsh(\s.*)?',
  'sh(\s.*)?',
  'zsh(\s.*)?',
  'curl(\s.*)?',
  'eval(\s.*)?',
  'exec(\s.*)?',
  'source(\s.*)?',
  'wget(\s.*)?',
  'dig(\s.*)?',
  'nslookup(\s.*)?',
  'host(\s.*)?',
  'ssh(\s.*)?',
  'scp(\s.*)?',
  'rsync(\s.*)?',
  'telnet(\s.*)?',
  'rm(\s.*)?',
]
computer_use = "never"
directory_allowlist = []
execute_commands = "always_ask"
mcp_allowlist = []
mcp_denylist = []
mcp_permissions = "agent_decides"
name = "Default"
read_files = "agent_decides"
run_agents = "always_ask"
web_search_enabled = true
write_to_pty = "always_ask"

[account]
is_settings_sync_enabled = false
