name: Scripts

on: [push]

jobs:
  brewfile:
    name: Brewfile
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Parse Brewfile
        run: brew bundle list --all --file Brewfile >/dev/null

  shell:
    name: shell.sh
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Run shell.sh
        run: HOME="$(mktemp -d)" ./scripts/shell.sh

  vscode:
    name: vscode.sh
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Run vscode.sh
        run: ./scripts/vscode.sh

  sublime:
    name: sublime.sh
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Run sublime.sh
        run: ./scripts/sublime.sh
